<!DOCTYPE html>
<html lang="no" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS:GO / CS2 Knife & Zeus Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Ikoner -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js for Grafer -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cs: {
                            orange: '#f59e0b',
                            yellow: '#eab308',
                            gold: '#fbbf24',
                            dark: '#0e1117',
                            card: '#161b22',
                            panel: '#1f293d',
                            border: '#2d3748',
                            zeus: '#06b6d4',
                            knife: '#ef4444',
                            tk: '#a855f7'
                        }
                    },
                    fontFamily: {
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3, h4, .font-cs {
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
        }
        .cs-gradient-text {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .cs-card {
            background: #161b22;
            border: 1px solid #30363d;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-[#161b22] border-b border-[#30363d] sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-amber-500/10 border border-amber-500/30 rounded-xl text-amber-500">
                    <i class="fa-solid fa-crosshairs text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wider cs-gradient-text">CS ARENA TRACKER</h1>
                    <p class="text-xs text-slate-400 font-medium tracking-wide flex items-center space-x-2">
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="currentSeasonLabel">AKTIV: SESONG 1</span>
                    </p>
                </div>
            </div>

            <!-- Header Action Buttons -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button onclick="window.openNewSeasonModal()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold rounded-lg border border-slate-600 transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-rotate text-amber-400"></i>
                    <span class="hidden sm:inline">NY SESONG</span>
                </button>
                <button onclick="window.openLogModal()" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold text-xs sm:text-sm rounded-lg shadow-lg shadow-amber-500/20 transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>REGISTRER HENDELSE</span>
                </button>
                <button onclick="window.openSettingsModal()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded-lg border border-slate-700 transition">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Hovedinnhold -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-8">

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-800 space-x-4">
            <button id="tabActiveBtn" onclick="window.switchTab('active')" class="pb-3 px-2 font-cs text-lg font-bold border-b-2 border-amber-500 text-amber-500 transition flex items-center space-x-2">
                <i class="fa-solid fa-trophy"></i>
                <span>AKTIV SESONG</span>
            </button>
            <button id="tabDashboardBtn" onclick="window.switchTab('dashboard')" class="pb-3 px-2 font-cs text-lg font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition flex items-center space-x-2">
                <i class="fa-solid fa-chart-line"></i>
                <span>ALL-TIME DASHBOARD & GRAF</span>
            </button>
        </div>

        <!-- SEKSJON 1: AKTIV SESONG VIEW -->
        <div id="viewActive" class="space-y-8">
            
            <!-- Badges Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="cs-card p-4 rounded-xl flex items-center justify-between border-l-4 border-red-500">
                    <div>
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">KNIVKONGEN</span>
                        <h4 id="badgeKnifeKing" class="text-lg font-bold text-slate-100 font-cs mt-0.5">Ingen ennå</h4>
                        <p id="badgeKnifeKingSub" class="text-xs text-slate-500">Flest kniv-drab</p>
                    </div>
                    <div class="p-3 bg-red-500/10 text-red-400 rounded-lg"><i class="fa-solid fa-hand-fist text-xl"></i></div>
                </div>

                <div class="cs-card p-4 rounded-xl flex items-center justify-between border-l-4 border-cyan-500">
                    <div>
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">ZEUS-MESTER</span>
                        <h4 id="badgeZeusMaster" class="text-lg font-bold text-slate-100 font-cs mt-0.5">Ingen ennå</h4>
                        <p id="badgeZeusMasterSub" class="text-xs text-slate-500">Flest zeus-drab</p>
                    </div>
                    <div class="p-3 bg-cyan-500/10 text-cyan-400 rounded-lg"><i class="fa-solid fa-bolt text-xl"></i></div>
                </div>

                <div class="cs-card p-4 rounded-xl flex items-center justify-between border-l-4 border-purple-500">
                    <div>
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">STRØM-OFFER</span>
                        <h4 id="badgeUnluckiest" class="text-lg font-bold text-slate-100 font-cs mt-0.5">Ingen ennå</h4>
